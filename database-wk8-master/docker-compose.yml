services:
  postgres:
    image: postgres:16
    container_name: spendwise-capstone-postgres
    environment:
      POSTGRES_DB: capstone
      POSTGRES_USER: capstone_admin
      POSTGRES_PASSWORD: local_dev_only_change_me
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capstone_admin -d capstone"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7
    container_name: spendwise-capstone-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
volumes:
  pgdata:
  redisdata:
